name: Build native MAS Android APK

on:
  push:
    branches: [main, native/expo-foundation]
  workflow_dispatch:

permissions:
  contents: read

# Serialize native APK builds without cancelling a build already in progress.
concurrency:
  group: native-mas-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Compile installable Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # These are the MAS public client values only. Never put service-role keys
    # or provider secrets in the mobile app.
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://hbwfgjpqgopearavplqb.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7gCVgi4SoqzoAE4G0U3mGA_ag_o2g8w
    steps:
      - name: Check out native MAS
        uses: actions/checkout@v7

      - name: Validate Expo project identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("app.json", "utf8")).expo;
          const expectedSlug = "mas";
          const expectedProjectId = "a41f1237-1323-499c-8df1-b9afd98fecc6";
          if (config.slug !== expectedSlug) {
            console.error(`Expected Expo slug ${expectedSlug}, found ${config.slug}`);
            process.exit(1);
          }
          if (config.extra?.eas?.projectId !== expectedProjectId) {
            console.error("The EAS project ID in app.json does not match the intended MAS project.");
            process.exit(1);
          }
          console.log("Expo slug and EAS project ID match the intended MAS project.");
          NODE

      - name: Validate public Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" || -z "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            echo "::error::Public Supabase configuration is missing."
            exit 1
          fi
          if [[ ! "$EXPO_PUBLIC_SUPABASE_URL" =~ ^https://[^/]+\.supabase\.co$ ]]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL must be the HTTPS URL for the intended Supabase project."
            exit 1
          fi
          if [[ "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == sb_secret_* || "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == *service_role* ]]; then
            echo "::error::A privileged Supabase key was supplied. Use a publishable key only."
            exit 1
          fi
          echo "Public Supabase configuration is present; values are not printed."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Android
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies and build state
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Verify Expo SDK dependency compatibility
        run: npx expo install --check

      - name: Type-check the native app
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Install required Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.1.12297006"
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"

          # Reuse a valid runner-provided NDK. Never delete a working install.
          if [[ -f "$NDK_PATH/source.properties" ]]; then
            echo "NDK $NDK_VERSION is already installed."
            exit 0
          fi

          for attempt in 1 2 3; do
            if sdkmanager --install "ndk;$NDK_VERSION" && [[ -f "$NDK_PATH/source.properties" ]]; then
              echo "NDK $NDK_VERSION installed successfully."
              exit 0
            fi
            echo "NDK installation attempt $attempt failed; removing only an incomplete install before retry."
            rm -rf "$NDK_PATH"
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 5)); fi
          done
          echo "Could not install NDK $NDK_VERSION after three attempts."
          exit 1

      - name: Build optimized release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon --console=plain -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true 2>&1 | tee "$RUNNER_TEMP/gradle-release.log"; then
              exit 0
            fi
            if ! grep -Eq "Received status code (429|5[0-9]{2})|Connection reset|Read timed out|Temporary failure in name resolution" "$RUNNER_TEMP/gradle-release.log"; then
              echo "Gradle failed for a non-transient reason; stopping without retry."
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Gradle release build still failed after three transient-network attempts."
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Transient dependency repository failure. Retrying Gradle in ${delay}s (attempt $((attempt + 1))/3)."
            sleep "$delay"
          done

      - name: Verify APK signature and Android package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -s "$APK"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -p 4 "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
          echo "APK file size: $(stat -c%s "$APK") bytes"

      - name: Enable KVM access for the Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::This runner does not expose /dev/kvm; an accelerated Android emulator cannot start here."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Install and launch APK in a clean Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          # The action splits input on newlines; keep the entire smoke test in one shell command.
          script: >-
            set -eu; test -s android/app/build/outputs/apk/release/app-release.apk; adb install -r android/app/build/outputs/apk/release/app-release.apk; adb shell monkey -p mw.wealthgrid.mas -c android.intent.category.LAUNCHER 1; for attempt in $(seq 1 15); do if adb shell pidof mw.wealthgrid.mas | grep -q .; then echo "MAS installed and launched successfully in the clean Android emulator."; exit 0; fi; sleep 2; done; echo "::error::MAS did not remain running after launch."; adb logcat -d -t 500 | grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS" || true; exit 1

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: mas-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
