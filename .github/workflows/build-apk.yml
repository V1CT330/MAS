name: Build native MAS Android APK

on:
  push:
    branches: [native/expo-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out native MAS
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Install required Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.1.12297006"
          rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
          for attempt in 1 2 3; do
            if sdkmanager --install "ndk;$NDK_VERSION"; then
              if [[ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]]; then
                echo "NDK $NDK_VERSION installed successfully."
                exit 0
              fi
            fi
            echo "NDK installation attempt $attempt failed; clearing partial files before retry."
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            sleep 5
          done
          echo "Could not install NDK $NDK_VERSION after three attempts."
          exit 1

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mas-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
