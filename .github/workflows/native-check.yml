name: Native MAS checks

on:
  pull_request:
    branches: [main]
    paths:
      - '**.tsx'
      - '**.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - '.github/workflows/native-check.yml'
  push:
    branches: [main, native/expo-foundation, responsive-device-layout]
    paths:
      - '**.tsx'
      - '**.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - '.github/workflows/native-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Expo project health check
        run: npx --yes expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Bundle Android JavaScript
        run: npx expo export --platform android
