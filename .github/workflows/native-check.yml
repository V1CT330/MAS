name: Native MAS checks

on:
  pull_request:
    branches: [main]
    paths:
      - '**.tsx'
      - '**.ts'
      - 'package.json'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - '.github/workflows/native-check.yml'
  push:
    branches: [native/expo-foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and create deterministic npm lockfile
        run: npm install
      - name: Commit generated lockfile when missing or changed
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Add deterministic npm lockfile"
              git push
            fi
          else
            echo "npm did not generate package-lock.json" >&2
            exit 1
          fi
      - name: Expo project health check
        run: npx --yes expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Bundle Android JavaScript
        run: npx expo export --platform android
