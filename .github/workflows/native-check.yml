name: Native MAS checks

on:
  pull_request:
    branches: [main]
    paths:
      - '**.tsx'
      - '**.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - '.github/workflows/native-check.yml'
  push:
    branches: [main, native/expo-foundation]
    paths:
      - '**.tsx'
      - '**.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - '.github/workflows/native-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: TypeScript check
        run: npm run typecheck
      - name: Bundle Android JavaScript
        run: npx expo export --platform android
